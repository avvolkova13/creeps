name: Verify Creeps and publish configured Pages gateway

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Prepare Pages gateway to server
        if: vars.CREEPS_APP_URL != ''
        run: npm run build:pages && npm run check:pages
        env:
          CREEPS_APP_URL: ${{ vars.CREEPS_APP_URL }}
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && vars.CREEPS_APP_URL != ''
        with:
          path: out

  deploy:
    if: github.event_name != 'pull_request' && vars.CREEPS_APP_URL != ''
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
